services:
  mysql:
    image: mysql:8.0
    container_name: ecs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123321
      MYSQL_DATABASE: ecs
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/ecs.sql:/docker-entrypoint-initdb.d/01-ecs.sql
      - ./mysql/init-platform.sql:/docker-entrypoint-initdb.d/02-platform.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123321"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  
  neo4j:
    image: neo4j:5.26-community
    container_name: ecs-neo4j
    restart: unless-stopped
    entrypoint: ["/init-entrypoint.sh"]
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins
      - ./neo4j/neo4j.dump:/init-data/neo4j.dump
      - ./neo4j/docker-entrypoint-init.sh:/init-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ecs-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ecs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  neo4j-data:
  es-data:
  redis-data:
